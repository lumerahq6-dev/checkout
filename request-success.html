<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Sent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
      padding: 20px;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2d2d4e;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 2rem; font-weight: 900; color: #10b981; margin-bottom: 12px; }
    .sub { color: #94a3b8; font-size: 1rem; line-height: 1.6; }
    .spinner {
      display: inline-block; width: 48px; height: 48px;
      border: 4px solid rgba(124,58,237,0.2); border-top-color: #7c3aed;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #fca5a5; }
  </style>
</head>
<body>
<div class="card">
  <div id="verifying">
    <div class="spinner"></div>
    <p class="sub">Verifying payment...</p>
  </div>

  <div id="success" style="display:none">
    <div class="icon">&#10004;</div>
    <h1>Success!</h1>
    <p class="sub">Your request was sent. It will be performed shortly.</p>
  </div>

  <div id="error" style="display:none">
    <div class="icon">&#10060;</div>
    <h1>Something went wrong</h1>
    <p class="sub error-msg">We couldn't verify your payment. Contact support with your session ID.</p>
  </div>
</div>

<script>
  var txnId = new URLSearchParams(location.search).get("txn") || new URLSearchParams(location.search).get("session_id");

  function show(id) {
    ["verifying","success","error"].forEach(function(s) {
      document.getElementById(s).style.display = s === id ? "" : "none";
    });
  }

  async function process() {
    if (!txnId) { show("error"); return; }
    try {
      var r = await fetch("/api/send-request-notification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ transactionId: txnId }),
      });
      var data = await r.json();
      show(r.ok && data.success ? "success" : "error");
    } catch(e) {
      show("error");
    }
  }

  process();
</script>
</body>
</html>
